name: CI

on:
  push:
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres with pgvector, for the examples store tests. Throwaway.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app eval tests
      # Unit tests only: no API key and no real statement data in CI.
      - run: pytest -q
