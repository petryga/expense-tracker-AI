[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-ai"
version = "0.1.0"
description = "Categorization service for the Expense Tracker: statement rows in, suggested categories out."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=1.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx2>=2.16",
  "ruff>=0.8",
  "mypy>=1.13",
]
# A small local embedding model, for retrieval of past choices. Without it
# the service still runs and suggests without examples.
embeddings = [
  "fastembed>=0.9",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional extra, not installed in CI.
module = "fastembed.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
